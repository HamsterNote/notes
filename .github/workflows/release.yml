name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Prepare version from tag
        id: release
        run: |
          OUTPUT=$(yarn --silent release:prepare)
          printf '%s\n' "$OUTPUT"
          printf '%s\n' "$OUTPUT" >> "$GITHUB_OUTPUT"

      - name: Verify package version
        run: test "${{ steps.release.outputs.version }}" = "${GITHUB_REF_NAME#v}"

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Build
        run: yarn build

      - name: Publish package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --tag "${{ steps.release.outputs.npm_tag }}"
