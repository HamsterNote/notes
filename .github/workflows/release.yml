name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Prepare version from tag
        id: release
        run: |
          OUTPUT=$(yarn --silent release:prepare)
          printf '%s\n' "$OUTPUT"
          printf '%s\n' "$OUTPUT" >> "$GITHUB_OUTPUT"

      - name: Verify package version
        run: test "${{ steps.release.outputs.version }}" = "${GITHUB_REF_NAME#v}"

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Test
        run: yarn test

      - name: Verify editor contracts
        # 编辑器内核迁移的契约门禁：依赖锁版、旧公共 API 冻结清单、Phase 1 范围守卫。
        # 三者独立于单元测试，必须在 Build/Publish 之前各自通过。
        run: |
          yarn verify:tiptap-deps
          yarn verify:legacy-api
          yarn verify:phase1-scope
          # phase1-ast-guards.test.mjs 不在 vitest 的 include（仅 src/**）中，
          # 需用 node --test 独立运行，覆盖 AST 守卫自身的解析路径。
          node --test scripts/phase1-ast-guards.test.mjs

      - name: Build
        run: yarn build

      - name: Publish package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --tag "${{ steps.release.outputs.npm_tag }}"
