name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare version from tag
        id: release
        run: |
          OUTPUT=$(pnpm release:prepare)
          printf '%s\n' "$OUTPUT"
          while IFS= read -r line; do
            printf '%s\n' "$line" >> "$GITHUB_OUTPUT"
          done <<EOF
          $OUTPUT
          EOF

      - name: Verify package version
        run: test "${{ steps.release.outputs.version }}" = "${GITHUB_REF_NAME#v}"

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Publish package
        run: npm publish --access public --tag "${{ steps.release.outputs.npm_tag }}"
